# customos.yaml -- single source of truth for the build pipeline.
#
# Edits here flow into the AOSP build via pipeline/init.sh (which uses `yq` to
# read this file at /srv/config/customos.yaml inside the container) and into
# the GitHub Actions release workflow (which reads the same fields to compute
# image names, R2 keys, and release tags).
#
# Hard rules:
#   - The hand-written device-tree .mk files MUST stay in sync with the
#     matching `profiles[*].spoof` block. CI's `validate-config` job enforces
#     this -- do not bypass it; if you change branding, change both.
#   - Any *.pem under ca/ is automatically picked up by the pipeline's
#     after-sync hook regardless of what the `cas:` list says (the list is
#     informational and useful for humans / docs).
#   - `vast.dph_max_usd` is a soft cap. The GH Actions workflow honours it via
#     vast/search.sh; if no offer matches, the workflow fails fast (cheaper
#     than letting it fall through to a $5/hr offer).

image:
  name: customos-devicefarm
  display_name: CustomOS Device Farm
  version: "1.0.0"
  vendor: tech-sumit

aosp:
  branch: android-16.0.0_r4
  manifest_url: https://android.googlesource.com/platform/manifest
  product_device: vsoc_x86_64
  base_lunch: aosp_cf_x86_64_phone-userdebug
  gpu_mode: gfxstream  # gfxstream | virglrenderer | swiftshader_indirect

# ---------------------------------------------------------------------------
# Device profiles. v1 builds only `enabled: true` profiles; pipeline iterates
# `lunch ${profile.lunch_target} && m -j` per profile and packages each into
# its own out/<profile-id>/ subdir. The hand-written .mk for each profile
# lives at device-tree/customos/<id>/customos_cf_<short>.mk.
# ---------------------------------------------------------------------------
profiles:
  - id: galaxy-s24-ultra
    enabled: true
    lunch_target: customos_cf_s24ultra-userdebug
    device_tree: device-tree/customos/galaxy-s24-ultra
    product_makefile: customos_cf_s24ultra.mk

    # Branding spoof. Every key here flows into PRODUCT_PROPERTY_OVERRIDES /
    # build.prop via the matching .mk. The pipeline's parity check (lint
    # workflow + before-build hook) asserts the .mk values match these.
    spoof:
      brand: samsung
      manufacturer: samsung
      model: SM-S928B
      product: e3qxxx
      device: e3q
      name: e3qxxx
      build_id: AP3A.240905.015.A2
      build_fingerprint: "samsung/e3qxxx/e3q:14/UP1A.231005.007/S928BXXU3AXJ4:user/release-keys"

    display:
      width_px: 1440
      height_px: 3120
      density_dpi: 505
      refresh_rate_hz: 120
      cutout: punch_hole_center

    hardware:
      ram_mb: 12288
      cpu_cores: 8
      fingerprint_sensor: optical_under_display
      # Hardware features written verbatim into
      #   frameworks/native/data/etc/customos_<id>.xml
      # which is then dropped into the system image. Apps query these via
      # PackageManager.hasSystemFeature(...).
      features:
        - android.hardware.camera
        - android.hardware.camera.front
        - android.hardware.camera.flash
        - android.hardware.camera.autofocus
        - android.hardware.camera.any
        - android.hardware.fingerprint
        - android.hardware.nfc
        - android.hardware.nfc.hce
        - android.hardware.telephony
        - android.hardware.telephony.gsm
        - android.hardware.sensor.accelerometer
        - android.hardware.sensor.gyroscope
        - android.hardware.sensor.proximity
        - android.hardware.sensor.compass
        - android.hardware.sensor.light
        - android.hardware.sensor.barometer
        - android.hardware.sensor.stepcounter
        - android.hardware.sensor.stepdetector
        - android.hardware.wifi
        - android.hardware.wifi.direct
        - android.hardware.bluetooth
        - android.hardware.bluetooth_le
        - android.hardware.location
        - android.hardware.location.gps
        - android.hardware.location.network
        - android.hardware.usb.host
        - android.hardware.usb.accessory
        - android.hardware.touchscreen
        - android.hardware.touchscreen.multitouch
        - android.hardware.touchscreen.multitouch.distinct
        - android.hardware.touchscreen.multitouch.jazzhand
        - android.hardware.faketouch
        - android.hardware.screen.portrait
        - android.hardware.screen.landscape
        - android.hardware.vulkan.level
        - android.hardware.vulkan.version
        - android.hardware.vulkan.compute
        - android.software.app_widgets
        - android.software.connectionservice
        - android.software.input_methods
        - android.software.print
        - android.software.midi
        - android.software.cant_save_state
        - android.software.webview
        - android.software.activities_on_secondary_displays
      camera:
        rear: ["200MP_main", "12MP_ultrawide", "10MP_tele3x", "50MP_tele5x"]
        front: ["12MP"]
      telephony:
        sim_count: 2
        default_operator: Verizon
        country_iso: us

  # Scaffold for v2; `enabled: false` so v1 builds skip it. Keep the entry so
  # docs/device-farm.md and the GH Release table stay informative.
  - id: pixel-8-pro
    enabled: false
    lunch_target: customos_cf_pixel8pro-userdebug
    device_tree: device-tree/customos/pixel-8-pro  # not yet created
    product_makefile: customos_cf_pixel8pro.mk
    spoof:
      brand: google
      manufacturer: Google
      model: Pixel 8 Pro
      product: husky
      device: husky
      name: husky
      build_id: AP1A.240505.005
      build_fingerprint: "google/husky/husky:14/AP1A.240505.005/11677807:user/release-keys"
    display:
      width_px: 1344
      height_px: 2992
      density_dpi: 489
      refresh_rate_hz: 120
      cutout: punch_hole_center
    hardware:
      ram_mb: 12288
      cpu_cores: 9
      features: []  # populate when scaffolding this profile
      camera: {}
      telephony: {}

# ---------------------------------------------------------------------------
# Custom root CAs. Any *.pem under ca/ is auto-staged into every profile's
# device-tree/<profile>/security/cacerts/<hash>.0 by the after-sync hook.
# This list is purely informational; do not rely on it for build behavior.
# ---------------------------------------------------------------------------
cas:
  - ca/customos-root-ca.pem

build:
  parallel_jobs: ""        # empty -> $(nproc) on the build host
  ccache_size: 50G

# Vast.ai search constraints. Filter is `cpu_cores_effective>=cpu_min` so the
# host's allocated slice is what counts (not the host's total physical cores).
vast:
  cpu_min: 32
  ram_min_gb: 64
  disk_min_gb: 1024
  dph_max_usd: 0.80
  image: ubuntu:22.04

release:
  r2:
    bucket: customos-aosp-builds
    prefix: builds/
    # Final R2 key:
    #   <bucket>/<prefix><profile-id>/<version>-<gitsha>/<file>
  github:
    draft: true
    generate_notes: true

# ---------------------------------------------------------------------------
# Device farm consumer side. Informational for v1; surfaced in the README and
# docs/device-farm.md so contributors know why the spoof and CA matter.
# ---------------------------------------------------------------------------
device_farm:
  documentation: docs/device-farm.md
  default_gpu_mode: gfxstream
  density_per_gpu: 10  # planning figure; benchmark per GPU before relying on it
