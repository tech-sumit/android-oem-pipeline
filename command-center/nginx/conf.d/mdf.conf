# Front STF + plugin REST + per-instance VNC/h264 streams.
# TLS termination is upstream (Cloudflare Tunnel for prod, plain http for dev).
server {
    listen 8080 default_server;
    server_name _;

    # Default: STF main app on :7100.
    location / {
        proxy_pass http://127.0.0.1:7100;
    }

    # STF websocket (auth + push) on :7110.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:7110;
    }

    # MDF plugin REST namespace -- mounted by stf-provider-emulator.
    location /mdf/ {
        proxy_pass http://127.0.0.1:7180;
    }

    # MDF plugin websocket (mitm flow stream + recording status).
    location /mdf-ws/ {
        proxy_pass http://127.0.0.1:7181;
    }

    # h264 stream out of mdf-plugin-recording (focused-instance NVENC).
    location ~ ^/stream/(?<serial>[^/]+)/h264$ {
        proxy_pass http://127.0.0.1:7185/stream/$serial/h264;
    }
}
