[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mayaos-devicefarm"
version = "1.0.0"
description = "Python SDK for the MayaOS Device Farm REST API."
authors = [{ name = "Sumit Agrawal", email = "mr.sumitagrawal.17@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.urls]
Source = "https://github.com/sumitagrawal/n8n"

[tool.setuptools.packages.find]
include = ["mayaos_devicefarm*"]
