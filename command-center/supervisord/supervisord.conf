; supervisord config for the unified MDF container.
;
; Tini is PID 1 (entrypoint). supervisord is the process tree root inside
; the container. Everything below is started in dependency order.
;
; Per-instance qemu emulators are NOT in here -- they are started/stopped
; dynamically by stf-provider-emulator (which uses fork/exec, not supervisord).

[supervisord]
nodaemon=true
user=root
logfile=/var/log/mdf/supervisord.log
pidfile=/run/mdf/supervisord.pid
loglevel=info

[supervisorctl]
serverurl=unix:///run/mdf/supervisor.sock

[unix_http_server]
file=/run/mdf/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[include]
files = /etc/supervisor/conf.d/*.conf
