; RethinkDB -- single-node by default; cluster mode (Phase 10) toggles via env.
[program:rethinkdb]
command=/usr/bin/rethinkdb --bind all --directory /var/lib/mdf/rethinkdb
        --canonical-address %(ENV_RETHINKDB_CANONICAL_ADDR)s
        --server-name %(ENV_RETHINKDB_SERVER_NAME)s
        --no-update-check
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/mdf/rethinkdb.log
stderr_logfile=/var/log/mdf/rethinkdb.err
environment=
    RETHINKDB_CANONICAL_ADDR="%(ENV_RETHINKDB_CANONICAL_ADDR)s",
    RETHINKDB_SERVER_NAME="%(ENV_RETHINKDB_SERVER_NAME)s"
user=mdf
