; The MDF qemu provider. Boots N qemu instances per the MDF_FLEET_SIZE
; env var and registers each one with STF over its provider ZMQ port.
;
; Started after STF (priority 30 > priority 20) so the ZMQ ports exist.

[program:stf-provider-emulator]
command=/opt/node/bin/node /opt/mdf/stf-provider-emulator/bin/provider.js
        --connect-sub tcp://127.0.0.1:7160
        --connect-push tcp://127.0.0.1:7170
        --provider %(ENV_MDF_PROVIDER_NAME)s
        --public-ip %(ENV_MDF_PUBLIC_IP)s
        --fleet-size %(ENV_MDF_FLEET_SIZE)s
        --image-dir /srv/mayaos-images
        --instance-dir /var/lib/mdf/instances
        --plugin-dir /opt/mdf
autostart=true
autorestart=true
startsecs=15
priority=30
stdout_logfile=/var/log/mdf/provider.log
stderr_logfile=/var/log/mdf/provider.err
environment=
    NODE_ENV="production",
    MDF_PROVIDER_NAME="%(ENV_MDF_PROVIDER_NAME)s",
    MDF_PUBLIC_IP="%(ENV_MDF_PUBLIC_IP)s",
    MDF_FLEET_SIZE="%(ENV_MDF_FLEET_SIZE)s"
user=mdf
