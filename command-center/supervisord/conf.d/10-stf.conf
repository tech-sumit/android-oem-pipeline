; STF backend (app + auth + processor + websocket).
;
; All STF subprocesses are started by `stf local` -- it forks the
; processor, reaper, triproxy, app, auth, websocket and storage units
; itself. We supervise just that one process tree.
;
; The --provider line is intentionally absent: our stf-provider-emulator
; runs in 11-stf-provider-emulator.conf because we need different startup
; ordering and explicit health checks for the qemu fleet.

[program:stf]
command=/opt/node/bin/node /opt/stf/bin/stf local
        --public-ip %(ENV_MDF_PUBLIC_IP)s
        --provider-min-port 7400
        --provider-max-port 7700
        --auth-type %(ENV_STF_AUTH_TYPE)s
        --no-cleanup
        --no-provider
        --user %(ENV_STF_DEFAULT_USER)s
autostart=true
autorestart=true
startsecs=5
priority=20
stdout_logfile=/var/log/stf/stf.log
stderr_logfile=/var/log/stf/stf.err
environment=
    NODE_ENV="production",
    RETHINKDB_PORT_28015_TCP_ADDR="127.0.0.1",
    RETHINKDB_PORT_28015_TCP_PORT="28015",
    SECRET="%(ENV_STF_SECRET)s",
    MDF_PUBLIC_IP="%(ENV_MDF_PUBLIC_IP)s",
    STF_AUTH_TYPE="%(ENV_STF_AUTH_TYPE)s",
    STF_DEFAULT_USER="%(ENV_STF_DEFAULT_USER)s",
    STF_SECRET="%(ENV_STF_SECRET)s"
user=mdf
