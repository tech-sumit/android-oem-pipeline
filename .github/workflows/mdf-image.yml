name: mdf-image

# Builds and publishes the MayaOS Device Farm container image to Docker Hub.
# The mdf:dev tag bundles DeviceFarmer/stf + the five MDF plugins, qemu,
# rethinkdb, mitmproxy, nginx, supervisord into one image; pods that join
# the fleet (`make mdf-fleet-up`) just docker-pull it and start.
#
# Trigger surface (mirrors NVIDIA-PIPELINE/console-build.yml):
#   - push to main / feat/* that touches command-center/ or .github/workflows/mdf-image.yml
#   - manual workflow_dispatch
#
# Secrets required:
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  -- Docker Hub push credentials.

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'command-center/**'
      - '.github/workflows/mdf-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to push alongside :latest (e.g. v0.1.0)'
        default: ''
        required: false

concurrency:
  group: mdf-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # STF is a real submodule; without recursive we'd ship an empty stub
          # and the runtime container would crash on first request.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          tags="docker.io/mrsumit/panditai-mdf:latest"
          short_sha="${GITHUB_SHA::7}"
          tags="${tags},docker.io/mrsumit/panditai-mdf:sha-${short_sha}"
          extra="${{ github.event.inputs.tag }}"
          if [ -n "${extra}" ]; then
            tags="${tags},docker.io/mrsumit/panditai-mdf:${extra}"
          fi
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "Will push:"; echo "${tags}" | tr ',' '\n'

      - name: Build + push mdf image
        uses: docker/build-push-action@v6
        with:
          context: command-center
          file: command-center/Dockerfile
          platforms: linux/amd64
          # arm64 is intentionally skipped: the fleet runs on RunPod x86_64
          # GPU hosts, and qemu-system-x86_64 + KVM are x86-only anyway.
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test (no /dev/kvm available on GHA, so just sanity-check supervisord)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash docker.io/mrsumit/panditai-mdf:latest \
            -c 'supervisord -v && nginx -t && which qemu-system-x86_64 && which adb && which mitmdump'
