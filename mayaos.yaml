# mayaos.yaml -- single source of truth for the build pipeline.
#
# Edits here flow into the AOSP build via pipeline/init.sh (which uses `yq` to
# read this file at /srv/config/mayaos.yaml inside the container) and into
# the GitHub Actions release workflow (which reads the same fields to compute
# image names, R2 keys, and release tags).
#
# Hard rules:
#   - The hand-written device .mk files MUST stay in sync with the matching
#     `profiles[*].spoof` block. CI's `validate-config` job enforces this --
#     do not bypass it; if you change branding, change both.
#   - Any *.pem under ca/ is automatically picked up by the pipeline's
#     after-sync hook regardless of what the `cas:` list says (the list is
#     informational and useful for humans / docs).
#   - `vast.dph_max_usd` is a soft cap. The GH Actions workflow honours it via
#     vast/search.sh; if no offer matches, the workflow fails fast (cheaper
#     than letting it fall through to a $5/hr offer).
#
# Rev 5 (Waydroid-style 3-layer split, see plan §3): per-device .mk files
# live under aosp-tree/device/mayaos/<device>/ and inherit the shared spoof
# block from aosp-tree/vendor/mayaos/product.mk. The `device_tree:` field
# below points at the device layer; the after-sync hook also splices the
# vendor and hardware layers automatically.

image:
  name: mayaos-devicefarm
  display_name: MayaOS Device Farm
  version: "1.0.0"
  vendor: tech-sumit

aosp:
  branch: android-16.0.0_r4
  manifest_url: https://android.googlesource.com/platform/manifest
  product_device: vsoc_x86_64
  base_lunch: aosp_cf_x86_64_phone-userdebug
  gpu_mode: gfxstream  # gfxstream | virglrenderer | swiftshader_indirect

# ---------------------------------------------------------------------------
# Device profiles. v1 builds only `enabled: true` profiles; pipeline iterates
# `lunch ${profile.lunch_target} && m -j` per profile and packages each into
# its own out/<profile-id>/ subdir. Per-device .mk files live under
# aosp-tree/device/mayaos/<device>/ and inherit aosp-tree/vendor/mayaos/
# product.mk for the shared spoof block (rev 5+ Waydroid-style 3-layer split).
# ---------------------------------------------------------------------------
