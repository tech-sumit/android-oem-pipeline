# ---------------------------------------------------------------------------
# Custom root CAs. Any *.pem under ca/ is auto-staged into
# aosp-tree/vendor/mayaos/rootdir/system/etc/security/cacerts/<hash>.0 by
# the after-sync hook (rev 5+ vendor-partition CA path; was per-profile dir).
# This list is purely informational; do not rely on it for build behavior.
# ---------------------------------------------------------------------------
cas:
  - ca/mayaos-root-ca.pem  # demo CA from gen-demo-ca.sh; replace with corp root for prod
  - ca/mdf-root-ca.pem     # MayaOS Device Farm root CA (used by mitmproxy on the pod;
                           # private key in Vault @ secret/mdf/ca per scripts/gen-mdf-root-ca.sh)

build:
  parallel_jobs: ""        # empty -> $(nproc) on the build host
  ccache_size: 50G

# Vast.ai search constraints. Filter is `cpu_cores_effective>=cpu_min` so the
# host's allocated slice is what counts (not the host's total physical cores).
vast:
  cpu_min: 32
  ram_min_gb: 64
  disk_min_gb: 1024
  dph_max_usd: 0.80
  image: ubuntu:22.04

release:
  r2:
    bucket: android
    prefix: builds/
    # Final R2 key:
    #   <bucket>/<prefix><profile-id>/<version>-<gitsha>/<file>
  github:
    draft: true
    generate_notes: true

# ---------------------------------------------------------------------------
# Device farm consumer side. Informational for v1; surfaced in the README and
# docs/device-farm.md so contributors know why the spoof and CA matter.
# ---------------------------------------------------------------------------
device_farm:
  documentation: docs/device-farm.md
  default_gpu_mode: gfxstream
  density_per_gpu: 10  # planning figure; benchmark per GPU before relying on it
