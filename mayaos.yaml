  - id: galaxy-s26-ultra-intel-gpu
    enabled: true
    lunch_target: mayaos_cf_s26ultra-trunk_staging-userdebug
    device_tree: aosp-tree/device/mayaos/galaxy-s26-ultra
    product_makefile: mayaos_cf_s26ultra.mk
    runtime_target: intel-gpu

    # Branding spoof. Every key here flows into PRODUCT_PROPERTY_OVERRIDES /
    # build.prop via the matching .mk. The pipeline's parity check (lint
    # workflow + before-build hook) asserts the .mk values match these.
    spoof:
      brand: samsung
      manufacturer: samsung
      model: SM-S948B
      product: s26uxxx
      device: s26u
      name: s26uxxx
      build_id: BP1A.250505.005
      build_fingerprint: "samsung/s26uxxx/s26u:16/BP1A.250505.005/S948BXXU1AYA1:user/release-keys"

    display:
      width_px: 1440
      height_px: 3120
      density_dpi: 505
      refresh_rate_hz: 120
      cutout: punch_hole_center

    hardware:
